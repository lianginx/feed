name: Build & Release

# 触发条件：
# - 推送 v* 标签（如 v1.1.0）时，自动在三个平台构建并发布到 GitHub Releases
# - 也可以手动触发（Actions 页面 → Run workflow 按钮）
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

# 需要写权限，才能创建 GitHub Release 并上传产物
permissions:
  contents: write

jobs:
  # 预创建 GitHub Release：
  # electron-builder 在 Release 已存在时会直接上传资产、不会重新创建。
  # 三个平台并行 --publish always 时若都不存在，会同时尝试创建导致 422 already_exists 冲突，
  # 因此先在此 job 创建空 Release，让后续构建 job 只上传不创建。
  prepare:
    name: Prepare release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create empty release (skip if exists)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME:-${GITHUB_SHA}}"
          echo "Preparing release for tag: ${TAG}"
          if gh release view "${TAG}" >/dev/null 2>&1; then
            echo "Release ${TAG} already exists, skipping creation"
          else
            gh release create "${TAG}" --title "${TAG}" --notes "自动构建发布" || \
              echo "release create 失败（可能并行冲突），继续尝试让构建 job 上传"
          fi

  build:
    name: Build on ${{ matrix.os }}
    needs: prepare
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false # 单个平台失败不阻塞其他平台
      matrix:
        include:
          - os: macos-latest
            script: build:mac
          - os: windows-latest
            script: build:win
          - os: ubuntu-latest
            script: build:linux

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # 未配置代码签名证书：macOS/Windows 均跳过签名（避免 CI 卡在签名/公证环节）
      # GITHUB_TOKEN 由仓库自动提供，electron-builder 用它把产物上传到 GitHub Releases
      - name: Build & Publish
        run: pnpm ${{ matrix.script }} --publish always
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: false
