name: Build & Release

# 触发条件：
# - 推送 v* 标签（如 v1.1.0）时，自动构建 macOS 安装包并发布到 GitHub Releases
# - 也可以手动触发（Actions 页面 → Run workflow 按钮）
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

# 需要写权限，才能创建 GitHub Release 并上传产物
permissions:
  contents: write

jobs:
  # 预创建 GitHub Release：
  # electron-builder 在 Release 已存在时会直接上传资产、不会重新创建。
  # 构建 job 使用 --publish always 时若 Release 不存在，会尝试创建 Release，
  # 因此先在此 job 创建空 Release，让后续构建 job 只上传不创建。
  # Release notes 由脚本基于「上一个 tag → 当前 tag」的提交历史自动生成。
  # 仅 tag 触发（v*）时创建 draft release：
  # workflow_dispatch 手动触发时 GITHUB_REF_NAME 是分支名（如 main），
  # 用它创建 release 会产生错误命名的正式发布，因此非 tag 触发整个 job 跳过。
  prepare:
    name: Prepare release
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      # fetch-depth: 0 拉取完整历史，用于对比上一个 tag 生成 release notes
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate release notes
        shell: bash
        run: bash .github/scripts/generate-release-notes.sh "${GITHUB_REF_NAME:-${GITHUB_SHA}}" /tmp/release-notes.md

      - name: Create or update draft release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME:-${GITHUB_SHA}}"
          echo "Preparing draft release for tag: ${TAG}"
          if gh release view "${TAG}" >/dev/null 2>&1; then
            echo "Release ${TAG} 已存在，更新 notes"
            gh release edit "${TAG}" --notes-file /tmp/release-notes.md
          else
            echo "创建 Draft Release ${TAG}"
            gh release create "${TAG}" --title "${TAG}" --notes-file /tmp/release-notes.md --draft || \
              echo "release create 失败（可能并行冲突），继续尝试让构建 job 上传"
          fi

  # 手动触发（workflow_dispatch）只做构建验证，不发布产物到 Release。
  # 注意：needs 的上游 job 被跳过时下游默认也会被跳过（除非显式 if），
  # 因此必须显式判断才能在 prepare 跳过（手动触发）时继续构建验证。
  # 同时排除 prepare 失败：publish 的 releaseType 为 release，
  # prepare 失败时若继续构建，electron-builder --publish 会直接创建正式
  # release（无 release notes、未经 draft 确认即公开），必须阻止。
  build:
    name: Build on ${{ matrix.os }}
    needs: prepare
    if: ${{ !cancelled() && needs.prepare.result != 'failure' }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            script: build:mac

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # ELECTRON_MIRROR：让 @electron/rebuild 下载 Electron headers 走 npmmirror 镜像，
      # 避免依赖 GitHub 连通性（曾因连接 github.com 的 Cloudflare IP 超时导致 install 失败）
      # shell: bash：安装失败时最多重试三次
      - name: Install dependencies
        shell: bash
        run: |
          for attempt in 1 2 3; do
            echo "pnpm install --frozen-lockfile（第 ${attempt} 次尝试）"
            if pnpm install --frozen-lockfile; then
              break
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "安装失败（可能是瞬时网络问题），10 秒后重试..."
              sleep 10
            else
              exit 1
            fi
          done
        env:
          ELECTRON_MIRROR: https://npmmirror.com/mirrors/electron/

      # 未配置代码签名证书：macOS 跳过签名（避免 CI 卡在签名/公证环节）
      # GITHUB_TOKEN 由仓库自动提供，electron-builder 用它把产物上传到 GitHub Releases
      # 仅 tag 触发时 --publish always 上传到 draft release；手动触发只构建不发布
      - name: Build & Publish
        run: pnpm ${{ matrix.script }} --publish ${{ startsWith(github.ref, 'refs/tags/v') && 'always' || 'never' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: false
  publish:
    name: Publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') && needs.build.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Publish release（失败重试 3 次）
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          echo "Publishing release ${TAG}"
          for attempt in 1 2 3; do
            if gh release edit "${TAG}" --draft=false; then
              echo "Release ${TAG} 已正式发布"
              exit 0
            fi
            echo "发布失败（第 ${attempt} 次尝试），5 秒后重试..."
            sleep 5
          done
          exit 1
